<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<title>Editor · EOD · Editor of Doom</title>
<style>
[hidden]{display:none!important}
:root{--bg:#0d0d0f;--panel:#17171b;--panel2:#23232b;--line:#3a3a46;--text:#fff;--accent:#d4202c;--yellow:#ffd400;--green:#1fbf4a;--red:#e0262f;--fs:15px;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--edbg:#101014;--grid:#1d1d24;--grid2:#2a2a35}
html.light{--bg:#e9e9ec;--panel:#ffffff;--panel2:#f1f1f4;--line:#c4c4cc;--text:#111;--edbg:#f7f7f9;--grid:#e3e3ea;--grid2:#cfcfd9}
html.font-mono{--font:"Courier New",Consolas,monospace}
html.inverted{filter:invert(1) hue-rotate(180deg)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--fs);overflow:hidden;overscroll-behavior:none}
body{touch-action:none;user-select:none;-webkit-user-select:none}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 6px;min-width:0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;border:0;padding:0;height:28px}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:var(--line);border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #555;margin-top:-8px}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid #555}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;white-space:nowrap;touch-action:manipulation}
button:active{transform:scale(.96)}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
button.demo{background:var(--accent);border-color:#ff5a5a;color:#fff;font-weight:800;letter-spacing:1px}
.grow{flex:1}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:6px;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:900;letter-spacing:1px;font-size:1.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .b2{color:var(--accent);text-shadow:0 0 6px rgba(255,40,40,.45);font-style:italic}
.brand .ver{font-weight:400;font-size:.7em;opacity:.8}
.tb{padding:6px 10px}
.iconbtn{padding:4px 6px;background:transparent;border-color:transparent;display:inline-flex;align-items:center}
.iconbtn.small{padding:2px 6px}
.ghostbtn{padding:0 2px;background:transparent;border:0;display:inline-flex;align-items:center}
.strip{display:flex;gap:5px;padding:5px 6px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:none;flex:none}
.strip::-webkit-scrollbar{display:none}
.strip .sep{width:1px;background:var(--line);margin:0 3px;flex:none}
.strip button{flex:none;font-size:.92em}
#stage{position:relative;flex:1;min-height:0;background:var(--edbg)}
#ed{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#status{position:absolute;left:6px;bottom:6px;font-size:.78em;background:rgba(0,0,0,.55);color:#fff;padding:3px 7px;border-radius:6px;pointer-events:none;max-width:70%}
#drawbar{position:absolute;right:10px;bottom:10px;display:flex;gap:10px}
.okbtn,.cancelbtn{width:58px;height:52px;border-radius:12px;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none}
.okbtn{background:var(--green);border-color:#0d8a31}
.cancelbtn{background:var(--red);border-color:#9a1118}
.okbtn::before{content:"";width:28px;height:14px;border-left:6px solid #fff;border-bottom:6px solid #fff;transform:rotate(-45deg) translate(2px,-3px)}
.cancelbtn::before{content:"↶";color:#fff;font-size:34px;font-weight:900;line-height:1}
.okbtn.sm,.cancelbtn.sm{width:46px;height:40px}
.panel{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.45);display:flex;flex-direction:column;overflow:hidden}
#props{right:8px;bottom:8px;width:min(340px,calc(100vw - 16px));height:min(46vh,430px)}
#props.collapsed{height:auto!important}
#props.collapsed #propsBody{display:none}
.phead{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--panel2);font-weight:700}
.mover{color:var(--yellow);font-weight:900;letter-spacing:.5px;padding:3px 8px;border:2px solid var(--yellow);border-radius:8px;touch-action:none;cursor:grab;font-size:.85em}
#propsBody{overflow:auto;padding:8px;flex:1;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.f{display:grid;grid-template-columns:42% 58%;align-items:center;gap:6px;margin:5px 0}
.f label{font-size:.88em}
.f input,.f select{width:100%}
.chk{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:.9em}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.h{font-weight:800;margin:10px 0 4px;color:var(--accent);font-size:.9em;letter-spacing:.5px;text-transform:uppercase}
.texf{display:flex;gap:5px;align-items:center}
.texf input{flex:1}
.texf canvas{width:30px;height:30px;border-radius:4px;border:1px solid var(--line);image-rendering:pixelated;flex:none}
.hint{font-size:.82em;opacity:.85;margin:4px 0}
#modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:10px}
#modalBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:760px;width:100%;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.mhead{padding:10px 12px;font-weight:900;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.mbody{padding:10px 12px;overflow:auto;flex:1;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.mfoot{padding:8px 12px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;align-items:center}
.mbody p,.mbody li{line-height:1.45}
.mbody h3{color:var(--accent);margin:14px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:.72em;word-break:break-all;text-align:center}
.tile canvas{width:64px;height:64px;image-rendering:pixelated}
.tile.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.list button{display:flex;width:100%;text-align:left;margin:3px 0;gap:8px;align-items:center;white-space:normal}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:1px solid #000}
.big3{display:flex;gap:10px;flex-wrap:wrap}
.big3 button{flex:1;min-width:150px;padding:16px;font-size:1.05em;font-weight:700}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#000;color:#fff;border:1px solid #444;padding:9px 14px;border-radius:10px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#tut{position:fixed;left:50%;top:auto;bottom:64px;transform:translateX(-50%);z-index:70;background:#111;color:#fff;border:2px solid var(--yellow);border-radius:12px;padding:8px 10px;width:min(520px,94vw);box-shadow:0 8px 30px rgba(0,0,0,.6)}
#tut .row{justify-content:flex-end}
.tut-glow{outline:3px solid var(--yellow)!important;outline-offset:2px;animation:pulse 1s infinite}
@keyframes pulse{50%{outline-color:transparent}}
/* game */
#game{position:fixed;inset:0;z-index:40;background:#000;touch-action:none;overflow:hidden}
#gv{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
#gtop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:6px;padding-top:max(6px,env(safe-area-inset-top));z-index:5;pointer-events:none}
#gtop>*{pointer-events:auto}
#gtop .cancelbtn{width:46px;height:40px}
#gTitle{color:#fff;font-weight:800;text-shadow:0 1px 2px #000;font-size:.9em}
#gtop .tb{background:rgba(0,0,0,.5);color:#fff;border-color:#555}
#gtop .iconbtn{color:#fff}
#ctls .ctl{position:absolute;transform:translate(-50%,-50%);color:#fff;font-weight:900;letter-spacing:1px;user-select:none;touch-action:none}
.ctl.round{width:78px;height:78px;border-radius:50%;background:rgba(40,40,48,.75);border:2px solid rgba(255,255,255,.55);padding:0}
#c-fire{width:96px;height:96px;background:rgba(190,20,30,.78);border-color:#ff7a7a;font-size:1.05em}
#c-stick{width:150px;height:150px;border-radius:50%;background:rgba(40,40,48,.45);border:2px solid rgba(255,255,255,.45)}
#c-stick .knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid #fff}
.ctl .mover{position:absolute;left:50%;top:-14px;transform:translateX(-50%);background:#000;font-size:12px;z-index:3}
#vbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:rgba(0,0,0,.55);z-index:6}
#vbar button{background:rgba(30,30,36,.9);color:#fff;border-color:#555;font-size:.85em;padding:7px 9px}
#arrbar{position:absolute;left:50%;top:60px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:#000;color:#fff;border:2px solid var(--yellow);border-radius:12px;padding:8px;z-index:8;width:min(560px,94vw)}
#arrbar span{flex:1;font-size:.85em}
#gover{position:absolute;inset:0;z-index:9;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;color:#fff;text-align:center}
#gover .box{background:#111;border:2px solid var(--accent);border-radius:14px;padding:18px;min-width:260px}
#gover h1{margin:0 0 10px;color:var(--accent);letter-spacing:2px;font-style:italic}
#gover .stats{font-family:"Courier New",monospace;font-size:1.1em;line-height:1.7;text-align:left;margin:8px auto 14px;display:inline-block}
#gover .row{justify-content:center}
/* EOD additions */
a.brand{color:var(--text);text-decoration:none}
.brand .sub{font-size:.75em;margin-left:4px}
.crow{display:grid;grid-template-columns:38% 62%;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.cname{font-size:.9em;font-weight:600}
.cbtns{display:flex;gap:5px;flex-wrap:wrap}
.cbtns button{padding:6px 8px;font-size:.85em;min-width:58px}
.cbtns .padb{flex:1 1 100%;text-align:left}
.eod-modal{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:10px}
.eod-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.eod-box .mh{padding:12px 14px;font-weight:900;border-bottom:1px solid var(--line)}
.eod-box .mb{padding:12px 14px;overflow:auto;flex:1;touch-action:pan-y}
.eod-box .mf{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.eod-box label{display:block;margin:10px 0 4px;font-weight:600;font-size:.9em}
.eod-box input,.eod-box textarea{width:100%}
.eod-box .tabs{display:flex;gap:6px}
.eod-box .err{color:#ff6b6b;font-weight:700;margin-top:8px}
.eod-box .muted{font-size:.85em}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#000;color:#fff;border:1px solid #444;padding:9px 14px;border-radius:10px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}

</style>
</head>
<body>
<div id="app">
  <header id="top">
    <a class="brand" href="index.html" title="EOD home"><span class="b1">E</span><span class="b2">O</span><span class="b1">D</span> <span class="b1 sub">EDITOR OF DOOM</span> <span id="ver" class="ver"></span></a>
    <div class="grow"></div>
    <button id="btnFile" class="tb">File</button>
    <button id="btnInfo" class="ghostbtn" title="Manual"><svg viewBox="0 0 32 36" width="30" height="34"><path d="M16 2C8.8 2 4 7.6 4 14.5V33l4-3 4 3 4-3 4 3 4-3 4 3V14.5C28 7.6 23.2 2 16 2z" fill="#fff" stroke="#000" stroke-width="1.5"/><circle cx="16" cy="11" r="2.2" fill="#000"/><rect x="14.2" y="15" width="3.6" height="11" rx="1.5" fill="#000"/></svg></button>
    <button id="btnInvert" class="iconbtn" title="Invert colors"><svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2a10 10 0 0 1 0 20z" fill="currentColor"/></svg></button>
    <button id="btnSettings" class="iconbtn" title="Settings"><svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.9a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button>
  </header>
  <nav id="modes" class="strip"></nav>
  <nav id="tools" class="strip"></nav>
  <div id="stage">
    <canvas id="ed"></canvas>
    <div id="status"></div>
    <div id="drawbar" hidden>
      <button id="drawOk" class="okbtn" title="Finish shape"></button>
      <button id="drawCancel" class="cancelbtn" title="Cancel drawing"></button>
    </div>
  </div>
</div>
<div id="props" class="panel">
  <div class="phead"><span class="mover" id="propsMover">Move</span><span id="propsTitle">Properties</span><div class="grow"></div><button id="propsToggle" class="iconbtn small">▾</button></div>
  <div id="propsBody"></div>
</div>
<div id="game" hidden>
  <canvas id="gv"></canvas>
  <div id="gtop">
    <button id="gExit" class="cancelbtn" title="Back to editor"></button>
    <span id="gTitle"></span>
    <div class="grow"></div>
    <button id="gControls" class="tb">Controls</button><button id="gArrange" class="tb">Arrange</button>
    <button id="gInfo" class="ghostbtn" title="Manual"></button>
    <button id="gInvert" class="iconbtn" title="Invert colors"></button>
  </div>
  <div id="ctls">
    <div class="ctl" id="c-stick" data-c="stick"><div class="knob"></div></div>
    <button class="ctl round" id="c-fire" data-c="fire">FIRE</button>
    <button class="ctl round" id="c-use" data-c="use">USE</button>
    <button class="ctl round" id="c-wpn" data-c="wpn">WPN</button>
    <button class="ctl round" id="c-map" data-c="map">MAP</button>
  </div>
  <div id="vbar" hidden></div>
  <div id="arrbar" hidden><span>Hold a yellow word to drag. Tap it to switch Move / Resize.</span><button id="arrOk" class="okbtn"></button><button id="arrCancel" class="cancelbtn"></button></div>
  <div id="gover" hidden></div>
</div>
<div id="modal" hidden><div id="modalBox"></div></div>
<div id="tut" hidden><div id="tutText"></div><div class="row"><button id="tutSkip" class="tb">Skip step</button><button id="tutQuit" class="cancelbtn"></button></div></div>
<div id="toast"></div>
<input type="file" id="fileIn" hidden accept=".wad,.WAD,.zip,.ZIP,.pk3,.PK3,.ipk3,.json,application/octet-stream,application/zip">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script id="nsde-main">
'use strict';
/* EOD · Editor of Doom (engine from No Shit Doom Editor) — Pulse Labs Studio */
const VERSION = '0.4.2', VC = 11;
const ORIGINAL_HTML = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

const LS = {
  get(k, d) { try { const v = localStorage.getItem('eod.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('eod.' + k, JSON.stringify(v)); } catch (e) { } }
};

/* ---------- crash / support log ---------- */
function logCrash(msg) {
  const arr = LS.get('crash', []);
  arr.push({ t: new Date().toISOString(), v: VERSION, m: String(msg).slice(0, 3000) });
  while (arr.length > 60) arr.shift();
  LS.set('crash', arr);
}
window.addEventListener('error', e => logCrash((e.message || 'error') + ' @' + (e.filename || '') + ':' + (e.lineno || '') + (e.error && e.error.stack ? '\n' + e.error.stack : '')));
window.addEventListener('unhandledrejection', e => logCrash('promise: ' + (e.reason && e.reason.stack || e.reason)));

let toastT = 0;
function toast(msg, ms = 2400) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms);
}

/* ---------- settings ---------- */
const DEF_SET = { theme: null, font: 'clean', fs: 15, grid: 32, snap: true, res: 320, layout: 'auto', ctlOpacity: 0.6, skill: 2, sens: 1, sound: true, inverted: false, ellipseSides: 16, defWall: 'STARTAN3', defFloor: 'FLOOR4_8', defCeil: 'CEIL3_5', mapName: 'MAP01' };
let S = Object.assign({}, DEF_SET, LS.get('settings', {}));
function saveSettings() { LS.set('settings', S); applySettings(); }
function isDark() { return S.theme === 'dark' || (S.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches); }
function applySettings() {
  const r = document.documentElement;
  r.classList.toggle('light', !isDark());
  r.classList.toggle('inverted', !!S.inverted);
  r.classList.toggle('font-mono', S.font === 'mono');
  r.style.setProperty('--fs', S.fs + 'px');
  if (window.edRedraw) edRedraw();
}
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySettings); } catch (e) { }
function toggleInvert() { S.inverted = !S.inverted; saveSettings(); }

/* ---------- modal helper ---------- */
// buttons: [{label|ok|cancel, fn}] — confirm is a green check, cancel is a red undo arrow and is ALWAYS last.
function modal(title, bodyHTML, buttons, onOpen) {
  const box = $('#modalBox');
  box.innerHTML = '';
  const h = document.createElement('div'); h.className = 'mhead'; h.innerHTML = '<span></span>'; h.firstChild.textContent = title;
  const b = document.createElement('div'); b.className = 'mbody';
  if (typeof bodyHTML === 'string') b.innerHTML = bodyHTML; else b.appendChild(bodyHTML);
  const f = document.createElement('div'); f.className = 'mfoot';
  buttons = (buttons || [{ cancel: 1 }]).slice();
  buttons.sort((a, b2) => (a.cancel ? 1 : 0) - (b2.cancel ? 1 : 0));
  for (const bt of buttons) {
    const e = document.createElement('button');
    if (bt.ok) { e.className = 'okbtn'; e.title = bt.title || 'Confirm'; }
    else if (bt.cancel) { e.className = 'cancelbtn'; e.title = bt.title || 'Close'; }
    else { e.textContent = bt.label; if (bt.cls) e.className = bt.cls; }
    e.onclick = () => { const r = bt.fn ? bt.fn(b) : undefined; if (r !== false) closeModal(); };
    f.appendChild(e);
  }
  box.append(h, b, f);
  $('#modal').hidden = false;
  if (onOpen) onOpen(b);
  return b;
}
function closeModal() { if (window.__modalClose) { const f = window.__modalClose; window.__modalClose = null; try { f(); } catch (e) { } } $('#modal').hidden = true; $('#modalBox').innerHTML = ''; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function download(name, data, mime) {
  const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'application/octet-stream' });
  const go = () => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
  };
  let canShare = false;
  try { canShare = !!(navigator.canShare && navigator.canShare({ files: [new File([blob], name)] })); } catch (e) { }
  const viaClaude = async () => {
    let fn = name, data = blob;
    if (!/\.(json|html|zip|txt)$/i.test(name)) { data = makeZip(name, new Uint8Array(await blob.arrayBuffer())); fn = name + '.zip'; }
    DL.save({ filename: fn, data }).then(() => toast('Saved ' + fn), e => toast(e && e.code === 'declined' ? 'Save cancelled' : 'Save failed: ' + (e && e.code || e)));

/* ---- Pulse Labs standard Move/Resize control: yellow word, hold to drag, tap to switch ---- */
function makeMovable(word, target, opts = {}) {
  let state = 'Move', down = null, holdT = 0, active = false;
  word.textContent = state;
  word.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation(); word.setPointerCapture(e.pointerId);
    const r = target.getBoundingClientRect();
    down = { x: e.clientX, y: e.clientY, r, moved: false };
    holdT = setTimeout(() => { active = true; word.style.background = 'var(--yellow)'; word.style.color = '#000'; }, 180);
  });
  word.addEventListener('pointermove', e => {
    if (!down) return; const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (Math.hypot(dx, dy) > 6) { down.moved = true; if (!active) { clearTimeout(holdT); active = true; } }
    if (!active) return;
    if (opts.onDrag) { opts.onDrag(state, dx, dy, down); return; }
    if (state === 'Move') { target.style.left = clamp(down.r.left + dx, -down.r.width + 60, innerWidth - 60) + 'px'; target.style.top = clamp(down.r.top + dy, 0, innerHeight - 40) + 'px'; target.style.right = 'auto'; target.style.bottom = 'auto'; }
    else { target.style.width = clamp(down.r.width + dx, 220, innerWidth) + 'px'; target.style.height = clamp(down.r.height + dy, 120, innerHeight) + 'px'; }
  });
  const up = () => {
    clearTimeout(holdT); if (!down) return;
    if (!down.moved && !active) { state = state === 'Move' ? 'Resize' : 'Move'; word.textContent = state; }
    else if (opts.onEnd) opts.onEnd(state);
    active = false; down = null; word.style.background = ''; word.style.color = '';
  };
  word.addEventListener('pointerup', up); word.addEventListener('pointercancel', up);
}

<li>The <b>Move</b> word on the properties panel is yellow: hold and drag it to move the panel. Tap it to switch to <b>Resize</b>.</li></ul>
<h3>Modes (same as Ultimate Doom Builder)</h3>
<ul><li><b>Vertices / Linedefs / Sectors / Things:</b> tap to select, drag to move. <b>Multi-select</b> adds to the selection, and dragging empty space draws a selection box. Edit the selection in the panel; changes apply to everything selected.</li>
<li><b>Draw Lines:</b> tap points. Tap the first point (or the green check) to close a sector. Tap the last point again to finish open lines. Open lines drawn across a room split it into two sectors.</li>
<li><b>Rectangle / Ellipse:</b> drag to draw a room. Drawing inside a room makes a sub-sector (raise or lower it for steps, pits or pillars).</li>
<li><b>Make Sector:</b> tap inside any closed loop of lines to make (or remake) a sector there.</li>
<li><b>3D Visual:</b> walk the map in 3D. Aim the crosshair and change heights, light and textures, or press <b>Play from here</b>.</li></ul>
<h3>Recipes</h3>
<ul><li><b>Door:</b> draw a thin sector (16 deep) between two rooms, select it, and press <b>Make Door</b>. Press USE in the Demo.</li>
<li><b>Lift:</b> make a sector as high as the ledge, select it, and press <b>Make Lift</b>. Walk onto it to send it down.</li>
<li><b>Stairs:</b> draw step sectors, select them in order with Multi-select, and press <b>Stairs</b>.</li>
<li><b>Exit:</b> select a wall in Linedefs mode and press <b>Make exit switch</b>.</li>
<li><b>Outdoors:</b> select a sector and press <b>Make ceiling sky</b>.</li>
<li><b>Tagged actions:</b> give a line an action and a tag (<b>New tag</b>), then give the target sector the same tag. The <b>Tags</b> explorer shows every pair.</li>
<li><b>Secret:</b> set a sector's Effect to <i>Secret area</i>.</li>
<li><b>Glass:</b> select a line between two areas (Linedefs mode) and press <b>🪟 Make glass</b>. Every part is a switch: see-through (and how much), tint color, stained-glass pattern from the middle texture, real reflection (strength, side-angle shine, distance), shine streaks, breakable (strength, cracks, flying shards, shards left on the floor, sounds, monsters can break it), blocks walking, stops bullets, monsters can see through. Quick looks: Clear window, Mirror, Frosted, Stained, Bulletproof, Pulse red, Ghost pane. Glass lines show light blue on the map. The test map has a pane between the corridor and the yard: shoot it out.</li></ul>
<h3>Demo controls</h3>
<ul><li>Left stick moves and strafes. Drag anywhere else (or drag across FIRE) to turn. <b>USE</b> opens doors and hits switches, <b>WPN</b> cycles weapons, <b>MAP</b> shows the automap.</li>
<li>Layouts for portrait 9:16, landscape 16:9 and Z Fold unfolded are picked automatically. Change them in Settings. <b>Arrange</b> lets you move and resize every button with the yellow words, saved separately for each layout.</li>
<li>PC: WASD moves, arrow keys turn, Ctrl or F fires, Space or E uses, Tab shows the map, 1-8 picks a weapon, Esc exits.</li></ul>
<h3>Export</h3>
<ul><li><b>Export Doom WAD:</b> a real Doom-format PWAD. Play it in <b>GZDoom</b> (PC) or <b>Delta Touch</b> (Android) with Doom II or the free <b>Freedoom</b> IWAD. GZDoom builds the nodes itself.</li>
<li><b>Export playable game:</b> one .html file with your map baked in. It opens straight into the game on any phone or PC browser. It's your shareable "executable".</li>
<li><b>Open:</b> loads Doom, Hexen and UDMF WADs (other people's maps), or a saved EOD project.</li></ul>
<h3>Playing other people's maps</h3>
<ul><li><b>File → Open any map</b> takes a .wad, a .zip straight from the /idgames archive, or a ZDoom .pk3. EOD reads its maps, its own textures, flats, sprites and sounds, and lets you pick ✎ Edit or ▶ Play for each map.</li>
<li>Most maps borrow art from the original Doom files. EOD fills that in with <b>Freedoom</b> (free, same names) or, if you own Doom/Doom II, open your own doom2.wad once and its art is used on your device only. It is never uploaded.</li>
<li>Classic (vanilla/limit-removing) maps play as made. Boom/ZDoom extras (scripts, slopes, 3D floors, DEHACKED monsters) are ignored for now.</li></ul>

<h3>Safety nets</h3>
<ul><li>Autosave after every change, 150 levels of Undo, <b>Map Analysis</b> before export, and a crash log in Settings → Support.</li></ul>

function monsterExportLumps() {
  const out = { decorate: '', sprites: [] }; const list = Object.entries(M.mon || {}); if (!list.length) return out;
  const SOUND = { imp: 'imp', beast: 'demon', floater: 'caco', soldier: 'grunt', hulk: 'baron', crawler: 'baby', cyber: 'cyber' };

  const DROPN = { 2007: 'Clip', 2008: 'Shell', 2001: 'Shotgun', 2002: 'Chaingun', 2011: 'Stimpack', 2012: 'Medikit', 2014: 'HealthBonus', 2015: 'ArmorBonus', 2047: 'Cell', 2010: 'RocketAmmo' };

    const melee = d.melee ? `  Melee:\n    ${pre} E ${Math.max(2, d.windup >> 1)} A_FaceTarget\n    ${pre} F 6 A_CustomMeleeAttack(random(${d.melee[0]}, ${d.melee[1]}), "${snd === 'grunt' ? 'imp' : snd}/melee")\n    Goto See\n` : '';

      const shot = d.atk.startsWith('hit') ? `A_CustomBulletAttack(${(4 + d.pellets).toFixed(1)}, 0, ${d.pellets}, ${Math.max(1, Math.round((d.dmg[0] + d.dmg[1]) / 6))}, "BulletPuff")` : `A_CustomMissile("${PROJACT[d.proj] || 'DoomImpBall'}", ${Math.round(sz.h * .57)}, 0)`;
      missile = `  Missile:\n    ${pre} E ${d.windup} A_FaceTarget\n` + Array.from({ length: d.burst }, (_, k) => `    ${pre} F ${k < d.burst - 1 ? d.burstGap : 8} Bright ${shot}\n`).join('') + `    Goto See\n`;
    }

  });

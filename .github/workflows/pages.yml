# Builds the live site: the pages from this repo + the encrypted files from the "vault" release,
# served from the same address so the browser can unlock them. Runs on every push.
name: Deploy site
on:
  push:
    branches: [main]
  release:
    types: [published, edited]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/v
          cp *.html CNAME _site/
          [ -d pulse-meter ] && cp -r pulse-meter _site/
          [ -d pls-zip ] && cp -r pls-zip _site/
          [ -d ai-toolbox ] && cp -r ai-toolbox _site/
          [ -d forge ] && cp -r forge _site/ && rm -rf _site/forge/src _site/forge/docs
          [ -d assets ] && cp -r assets _site/
          # Product pages with proofs (Overview · What it does · Proofs · Demo): any folder holding a proofs.json ships.
          for d in */; do [ -f "${d}proofs.json" ] && cp -r "$d" _site/; done
          cp *.js _site/ 2>/dev/null || true
          [ -d EOD ] && cp -r EOD _site/ && rm -rf _site/EOD/engine
          # Lowercase /eod/ redirect is generated here, not stored in the repo: a repo holding both EOD/ and eod/
          # breaks every Windows clone (case-insensitive), which stopped the farm's site watcher on 2026-11-18.
          mkdir -p _site/eod && printf '%s' '<!DOCTYPE html><html><head><meta charset="utf-8"><title>EOD</title><meta http-equiv="refresh" content="0;url=../EOD/"><link rel="canonical" href="../EOD/"></head><body><a href="../EOD/">EOD · Editor of Doom</a></body></html>' > _site/eod/index.html
          [ -d vault ] && cp -r vault _site/
          if gh release view vault --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download vault --repo "$GITHUB_REPOSITORY" --pattern '*.bin' --dir _site/v
          fi
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
